name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 若改了儲存庫名稱，把這裡改為 /<repo-name>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # 分析與廣告 ID（皆為公開值）。來源用 Repository/Org Variables（vars.*），非 secrets。
          # 未在 repo 設定時，vars.* 展開為空字串＝停用，build 仍正常。
          # 設定位置：Settings → Secrets and variables → Actions → Variables。
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_INFEED: ${{ vars.VITE_ADSENSE_SLOT_INFEED }}
          VITE_ADSENSE_SLOT_SIDEBAR: ${{ vars.VITE_ADSENSE_SLOT_SIDEBAR }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
